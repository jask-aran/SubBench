name = "subbench"
main = "src/subbench/server/entry.py"
compatibility_date = "2026-07-01"

# Python Workers are in open beta and require this flag. The estimator is pure standard
# library and single-threaded, so it runs unmodified on Pyodide; if the beta proves
# unworkable the same package runs under Containers, which is a deployment change rather
# than a rewrite. Keep entry.py thin to preserve that.
compatibility_flags = ["python_workers"]

[[d1_databases]]
binding = "DB"
database_name = "subbench"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[assets]
directory = "src/subbench/server/static"
binding = "ASSETS"

# Prune usage rows once a window is long settled. Entitlement snapshots are never pruned:
# they are small, and an unsampled moment cannot be recovered.
[triggers]
crons = ["0 4 * * *"]

[vars]
USAGE_RETENTION_DAYS = "90"
