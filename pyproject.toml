[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subbench"
version = "0.3.0"
description = "Estimate API-equivalent entitlement value from coding-agent subscriptions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jaskaran Singh" }]
dependencies = ["plotext>=5.3,<6", "numpy>=1.26", "zstandard>=0.22; python_version < '3.14'"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
subbench = "subbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subbench"]

[tool.hatch.build.targets.wheel.force-include]
"src/subbench/server/schema.sql" = "subbench/server/schema.sql"
"src/subbench/data/prices.json" = "subbench/data/prices.json"
"src/subbench/data/prices_fallback.json" = "subbench/data/prices_fallback.json"

[tool.pytest.ini_options]
testpaths = ["tests", "LLM-Pareto/tests"]
