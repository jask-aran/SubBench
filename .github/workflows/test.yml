name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q --tb=short

  # The Worker and the site's display rules are JavaScript. Their tests need no browser and
  # no dependencies, so they run once rather than across the Python matrix. The site itself
  # is a Vite build; building and typechecking it here means a broken page fails CI rather
  # than `wrangler deploy`.
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node --test "tests/*.mjs"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # The release builds this same single-file executable; building it on every change means a
  # packaging break shows here and not on a release tag.
  binary:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sh packaging/binary/build.sh
      - run: dist/bin/subbench-linux-x64 privacy
      - run: dist/bin/subbench-linux-x64 service install --dry-run
