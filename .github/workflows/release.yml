name: release

# A tag like v0.3.0 builds the single-file `subbench` executable for each platform and
# publishes it on the GitHub release with a SHA-256 file and a signed build-provenance
# attestation, so anyone can check the binary they run was built from this source by this
# workflow:
#
#   gh attestation verify subbench-linux-x64 --repo jask-aran/SubBench
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported runners, so the Linux builds run on older glibc too.
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]' && pytest -q --tb=short
      - run: sh packaging/binary/build.sh
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/bin/subbench-*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: dist/bin/

  publish:
    needs: binary
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/bin
          merge-multiple: true
      - run: cat dist/bin/*.sha256 > dist/bin/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bin/subbench-*
            dist/bin/SHA256SUMS
            packaging/install.sh
