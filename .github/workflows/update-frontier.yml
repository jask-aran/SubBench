name: Update frontier data

# Daily refresh of the benchmark bundle the site serves (web/public/data/frontier.json):
# Artificial Analysis (models and coding agents), DeepSWE and FrontierCode. It commits the
# refreshed data and, when anything changed, deploys the Worker and site with `wrangler deploy`.
# The deploy needs the repository secret CLOUDFLARE_API_TOKEN; without it the job skips the
# deploy and does not fail.
#
# The scraper's --check runs first. A failed check means Artificial Analysis changed its
# pages: the job stops before writing anything, so a broken scrape never replaces good data.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-frontier
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        # An explicit bash adds pipefail, so a failed --check is not hidden by `| tee`.
        shell: bash
        working-directory: LLM-Pareto
    env:
      CLOUDFLARE_ACCOUNT_ID: 2158dea73d15111ed8386b254f69dbb2
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      # The scripts run through uv so that pyproject.toml's dependencies (argcomplete) are
      # installed; the runner's own Python has none of them.

      - name: Check the Artificial Analysis pages still parse
        run: uv run --locked python artificial_analysis_v2.py --check --compact | tee check.json

      - name: Collect Artificial Analysis
        run: uv run --locked python archive.py collect

      - name: Refresh DeepSWE and FrontierCode
        run: bash update.sh

      - name: Build the site bundle
        run: uv run --locked python export-web-data.py

      - name: Commit if anything changed
        id: commit
        working-directory: .
        run: |
          rm -f LLM-Pareto/check.json
          git add LLM-Pareto/leaderboard.json LLM-Pareto/frontiercode-data.json \
                  LLM-Pareto/frontier-data.json web/public/data/frontier.json
          # LLM-Pareto/data is ignored for local runs; the archive is tracked, so force it.
          git add -f LLM-Pareto/data/archive.sqlite3 LLM-Pareto/data/json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh frontier data [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Workers deploys and static asset requests are free on the Free plan; the build runs here.
      - uses: actions/setup-node@v4
        if: steps.commit.outputs.changed == 'true' && env.HAS_CF_TOKEN == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Deploy the Worker and site
        if: steps.commit.outputs.changed == 'true' && env.HAS_CF_TOKEN == 'true'
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci --no-audit --no-fund
          npx wrangler deploy

      - name: Note the skipped deploy
        if: steps.commit.outputs.changed == 'true' && env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the site was not deployed."
